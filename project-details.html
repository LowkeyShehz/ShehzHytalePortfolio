<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - Hytale World Designer</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rubik:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌲</text></svg>">
</head>

<body>

    <header class="detail-header">
        <div class="container">
            <a href="index.html" class="back-link">← Back to Portfolio</a>
        </div>
    </header>

    <main class="project-detail-container container">
        <div id="loading" class="loading-state">Loading project details...</div>

        <article id="project-content" style="display: none;">
            <header class="project-header">
                <h1 id="detail-title" class="detail-title">Project Title</h1>
                <p id="detail-description" class="detail-description">Project description goes here.</p>
                <div class="detail-meta">
                    <a id="detail-link" href="#" target="_blank" class="cta-button">View on X</a>
                </div>
            </header>

            <section class="gallery-section">
                <h2>Gallery</h2>
                <div class="gallery-grid" id="gallery-grid">
                    <!-- Images will be injected here -->
                </div>
            </section>
        </article>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Shehzan</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
